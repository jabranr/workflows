# Validate this repository's workflows and actions with SecureCI, and fail
# when an action ref has moved since it was locked in secureci.lock.
# After adding or bumping an action: `npm run ci:inventory:update`.
name: SecureCI GHA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SecureCI GHA
        uses: secure-ci/cli@251440e56fb0d03d8864b0dd29a4431d81ff63d8 # v1.5.0
        with:
          # Validate composite actions too, not only .github/workflows.
          files: .github/workflows/*.yml .github/actions/*/action.yml
          inventory: check
          # Code scanning isn't set up for this repository, so skip the SARIF
          # upload; the job still fails when validation does. To see results in
          # the Security tab, enable code scanning, drop this, and grant
          # security-events: write and actions: read.
          upload-sarif: false
