name: SecureCI GHA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: SecureCI GHA
        uses: secure-ci/cli@4de5123f55633171aeca62a1377f8c20a63c975f # v1.3.2
        with:
          # Fail when an action ref has moved since it was locked in secureci.lock.
          inventory: check
          # Code scanning isn't enabled on this repository, so skip the SARIF
          # upload; the job still fails when validation does.
          upload-sarif: false
