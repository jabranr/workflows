name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '24.15.0' # @see https://github.com/microsoft/playwright/issues/40998
      runner:
        description: 'Runner label for jobs (e.g. ubuntu-24.04, ubuntu-latest)'
        type: string
        default: 'ubuntu-24.04'
      test-type:
        description: 'Type of tests to run (functional, e2e, smoke, vr)'
        type: string
        default: functional
      container-image:
        description: 'Optional container image to run the job in. Image must include git. Leave empty to run directly on the runner.'
        type: string
        default: ''
      run-node-setup:
        description: 'Whether to run actions/setup-node. Set false when the container image already provides Node and npm; node-version is then ignored.'
        type: boolean
        default: true
      run-playwright-setup:
        description: 'Whether to detect the Playwright version, cache, and install browsers. Set false when the container image already ships with Playwright browsers.'
        type: boolean
        default: true
      timeout-minutes:
        description: 'Timeout in minutes'
        type: number
        default: 60
      reports-retention-days:
        description: 'Reports retention in days'
        type: number
        default: 7

permissions:
  contents: read

jobs:
  integration:
    name: ${{ inputs.test-type }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    steps:
      - name: Validate test-type input
        run: |
          case "${{ inputs.test-type }}" in
            functional|e2e|smoke|vr) ;;
            *) echo "::error::Unsupported test-type: ${{ inputs.test-type }} (expected one of: functional, e2e, smoke, vr)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ inputs.run-node-setup }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        if: ${{ inputs.run-playwright-setup }}
        id: playwright-version
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Playwright ships browser builds per OS release (e.g. ubuntu24.04, ubuntu26.04), so the
          # cache key includes it. Read in a subshell so os-release's own VERSION does not leak.
          if [ -r /etc/os-release ]; then
            OS_RELEASE=$(. /etc/os-release && echo "${ID}${VERSION_ID}")
          else
            OS_RELEASE=unknown
          fi
          echo "os-release=$OS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ inputs.run-playwright-setup }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.os-release }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: ${{ inputs.run-playwright-setup }}
        timeout-minutes: 10
        env:
          # actions/cache leaves cache-hit unset (empty) on a full miss, so anything but 'true' installs.
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/playwright-install.log"
          RC_FILE="${RUNNER_TEMP:-/tmp}/playwright-install.rc"
          # Stream the output and keep a copy for the hints below (POSIX sh has no pipefail).
          {
            rc=0
            if [ "$CACHE_HIT" = 'true' ]; then
              npx playwright install-deps || rc=$?
            else
              npx playwright install --with-deps chromium || rc=$?
            fi
            echo "$rc" > "$RC_FILE"
          } 2>&1 | tee "$LOG"
          rc=$(cat "$RC_FILE")

          HINT="Upgrade @playwright/test in your repository (Ubuntu 26.04 needs 1.61.0 or newer), or pass 'runner: ubuntu-24.04' to reusable-integration.yml."
          if [ "$rc" -ne 0 ]; then
            if grep -q 'does not support chromium on' "$LOG"; then
              PLATFORM=$(sed -n 's/.*does not support chromium on \([^ ]*\).*/\1/p' "$LOG" | head -n 1)
              echo "::error title=Playwright cannot install chromium::Playwright $PLAYWRIGHT_VERSION has no chromium build for $PLATFORM. $HINT"
            fi
            exit "$rc"
          fi
          # install-deps only warns (exit 0) when it has no dependency list for this OS.
          if grep -q 'Cannot install dependencies for' "$LOG"; then
            echo "::warning title=Playwright system dependencies not installed::Playwright $PLAYWRIGHT_VERSION does not support this runner OS, so browsers may fail to launch. $HINT"
          fi

      - name: Run ${{ inputs.test-type }} tests
        env:
          CI: true
        run: npm run test:${{ inputs.test-type }}

      - name: Save test reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.test-type }}
          path: playwright-report-${{ inputs.test-type }}/
          retention-days: ${{ inputs.reports-retention-days }}
